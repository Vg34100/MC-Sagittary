import groovy.json.JsonOutput
import groovy.json.JsonSlurper

if (stonecutter.eval(stonecutter.current.version, '>=26.3')) {
    processResources.doLast {
        // Loot predicates now use the standard dispatch key, including the
        // Infinity override's conditional ammo-use effect.
        Closure predicates
        predicates = { value ->
            if (value instanceof Map) {
                if (value.containsKey('condition')) value.type = value.remove('condition')
                value.values().each { predicates(it) }
            } else if (value instanceof List) value.each { predicates(it) }
        }
        fileTree(destinationDir).matching { include 'data/**/enchantment/**/*.json' }.each { file ->
            def data = new JsonSlurper().parse(file)
            predicates(data)
            file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        fileTree(destinationDir).matching { include 'data/**/advancement/**/*.json' }.each { file ->
            def data = new JsonSlurper().parse(file)
            data.criteria?.values()?.each { criterion ->
                if (criterion.trigger == 'minecraft:recipe_unlocked' && criterion.conditions?.containsKey('recipe')) {
                    criterion.conditions.recipes = criterion.conditions.remove('recipe')
                }
            }
            file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        def mixins = new File(destinationDir, 'sagittary.mixins.json')
        def data = new JsonSlurper().parse(mixins)
        data.mixins.remove('BundleContentsMutableAccessor') // Contents now store immutable templates.
        mixins.setText(JsonOutput.prettyPrint(JsonOutput.toJson(data)) + '\n', 'UTF-8')
        def fabric = new File(destinationDir, 'sagittary-fabric.mixins.json')
        if (fabric.isFile()) {
            def client = new JsonSlurper().parse(fabric)
            client.client.add('client.CrossbowHandsRendererMixin')
            fabric.setText(JsonOutput.prettyPrint(JsonOutput.toJson(client)) + '\n', 'UTF-8')
        }
    }
}

// 1.20.1 uses NBT predicates/results and plural datapack directories. Keep all
// component identities and exact model variants, rather than dropping criteria.
def nbtResources
if (stonecutter.current.version == '1.20.1') {
    nbtResources = {
        def parse = { File file -> new JsonSlurper().parse(file) }
        def write = { File file, value -> file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8') }
        def componentNbt = { Map components ->
            components.collectEntries { key, value ->
                switch (key) {
                    case 'sagittary:arrow_parts': return [(key): value]
                    case 'minecraft:custom_model_data': return [CustomModelData: value]
                    default: throw new GradleException("Unsupported 1.20.1 item component: ${key}")
                }
            }
        }
        Closure convert
        convert = { value ->
            if (value instanceof Map) {
                if (value.components instanceof Map) value.nbt = JsonOutput.toJson(componentNbt(value.remove('components')))
                if (value.items instanceof String) value.items = [value.items]
                value.values().each { convert(it) }
            } else if (value instanceof List) value.each { convert(it) }
        }
        fileTree(destinationDir).matching { include 'data/**/recipe/**/*.json' }.each { file ->
            def data = parse(file)
            if (data.result instanceof Map && data.result.containsKey('id')) data.result.item = data.result.remove('id')
            convert(data)
            write(file, data)
        }
        fileTree(destinationDir).matching { include 'data/**/advancement/**/*.json' }.each { file ->
            def data = parse(file)
            def icon = data.display?.icon
            if (icon instanceof Map && icon.containsKey('id')) icon.item = icon.remove('id')
            convert(data)
            write(file, data)
        }
        def mixinsFile = new File(destinationDir, 'sagittary.mixins.json')
        def mixins = parse(mixinsFile)
        mixins.mixins.removeAll(['BundleContentsAccessor', 'BundleContentsMutableAccessor'])
        mixins.mixins.add('CrossbowQuiverAmmoMixin')
        mixins.mixins.add('QuiverEnchantingMixin')
        write(mixinsFile, mixins)
        // Registry-backed enchantments replace the newer datapack definition.
        delete(new File(destinationDir, 'data/sagittary/enchantment'))
        def plural = [recipe: 'recipes', advancement: 'advancements', loot_table: 'loot_tables',
                      'tags/item': 'tags/items', 'tags/block': 'tags/blocks', 'tags/entity_type': 'tags/entity_types']
        fileTree(destinationDir).matching { include 'data/**' }.files.toList().each { file ->
            def path = destinationDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            def parts = path.split('/', 3)
            plural.each { singular, name ->
                if (parts.length == 3 && parts[2].startsWith(singular + '/')) {
                    def target = new File(destinationDir, "${parts[0]}/${parts[1]}/${name}/${parts[2].substring(singular.length() + 1)}")
                    target.parentFile.mkdirs()
                    java.nio.file.Files.move(file.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}

// Legacy NeoForge has no supported Trinkets-family provider. Remove the optional
// modern declaration structurally, without maintaining another metadata file.
if (stonecutter.eval(stonecutter.current.version, '<26.1') && project.name.endsWith('-neoforge')) {
    processResources.doLast {
        def metadata = new File(destinationDir, 'META-INF/neoforge.mods.toml')
        def blocks = metadata.getText('UTF-8').split(/(?m)(?=^\[\[dependencies\.sagittary\]\])/)
        metadata.setText(blocks.findAll { !it.contains('modId = "trinkets_updated"') }.join(''), 'UTF-8')
    }
}

// Translate serialized formats, never Java. Originals remain canonical 26.x.
if (stonecutter.eval(stonecutter.current.version, '<26.1')) {
    tasks.named('processResources') {
        inputs.file(rootProject.file('gradle/resource-compat.gradle'))
        doLast {
            def parse = { File file -> new JsonSlurper().parse(file) }
            def write = { File file, value ->
                file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n', 'UTF-8')
            }
            def ingredient = { value ->
                value instanceof String ? (value.startsWith('#') ? [tag: value.substring(1)] : [item: value]) : value
            }
            fileTree(destinationDir).matching { include 'data/**/recipe/**/*.json' }.each { file ->
                def recipe = parse(file)
                ['ingredient', 'base', 'addition', 'template'].each { key ->
                    if (recipe.containsKey(key)) recipe[key] = ingredient(recipe[key])
                }
                if (recipe.ingredients instanceof List) recipe.ingredients = recipe.ingredients.collect(ingredient)
                if (recipe.key instanceof Map) recipe.key = recipe.key.collectEntries { key, value -> [(key): ingredient(value)] }
                write(file, recipe)
            }

            // CustomModelData was an integer in 1.21; advancement icons also
            // contain item components and must agree with ComponentArrowItem.
            Closure components
            components = { value ->
                if (value instanceof Map) {
                    def data = value['minecraft:custom_model_data']
                    if (data instanceof Map && data.strings) value['minecraft:custom_model_data'] = data.strings.first() as int
                    value.values().each { components(it) }
                } else if (value instanceof List) value.each { components(it) }
            }
            fileTree(destinationDir).matching { include 'data/**/advancement/**/*.json' }.each { file ->
                def advancement = parse(file)
                components(advancement)
                write(file, advancement)
            }

            // Derive legacy predicates from item definitions. In particular,
            // old checked-in arrow overrides predate the current 240 variants.
            fileTree(destinationDir).matching { include 'assets/**/items/*.json' }.each { definition ->
                def path = destinationDir.toPath().relativize(definition.toPath()).toString().replace('\\', '/')
                def modelFile = new File(destinationDir, path.replace('/items/', '/models/item/'))
                if (!modelFile.isFile()) throw new GradleException("Missing legacy model for ${path}")
                def graph = parse(definition).model
                def model = parse(modelFile)
                def overrides = []
                if (graph.type == 'minecraft:select' && graph.property == 'minecraft:custom_model_data') {
                    graph.cases.each { choice ->
                        def values = choice.when instanceof List ? choice.when : [choice.when]
                        values.each { value -> overrides.add([predicate: [custom_model_data: value as int], model: choice.model.model]) }
                    }
                    overrides.sort { it.predicate.custom_model_data }
                } else if (graph.type == 'minecraft:range_dispatch' && graph.property == 'minecraft:bundle/fullness') {
                    // Item definitions can select a different base model; keep
                    // that relationship when moving to legacy predicates.
                    model = [parent: graph.fallback.model]
                    graph.entries.each { entry ->
                        overrides.add([predicate: ['sagittary:fullness': entry.threshold], model: entry.model.model])
                    }
                } else if (graph.type == 'minecraft:model') {
                    def ownModel = definition.parentFile.parentFile.name + ':item/' + definition.name.replaceFirst(/\.json$/, '')
                    // A flat definition normally points at the existing model,
                    // not a new parent. Replacing it would create a self-loop.
                    if (graph.model != ownModel) model = [parent: graph.model]
                    write(modelFile, model)
                } else {
                    def charge = graph.property == 'minecraft:charge_type' ? graph : null
                    def using = charge ? charge.fallback : graph
                    if (using.property == 'minecraft:using_item' && using.on_true.type == 'minecraft:range_dispatch') {
                        def pull = using.on_true
                        overrides.add([predicate: [pulling: 1], model: pull.fallback.model])
                        pull.entries.each { entry ->
                            overrides.add([predicate: [pulling: 1, pull: entry.threshold], model: entry.model.model])
                        }
                    } else {
                        throw new GradleException("Unsupported legacy item definition: ${path}")
                    }
                    charge?.cases?.each { choice ->
                        overrides.add([predicate: [charged: 1, firework: choice.when == 'rocket' ? 1 : 0], model: choice.model.model])
                    }
                }
                if (overrides) {
                    model.overrides = overrides
                    write(modelFile, model)
                }
                // Only remove the generated target copy of the newer schema.
                delete(definition)
            }

            def mixinsFile = new File(destinationDir, 'sagittary.mixins.json')
            def mixins = parse(mixinsFile)
            mixins.client.remove('client.BundleMouseActionsMixin') // Target does not exist in 1.21.
            write(mixinsFile, mixins)
        }
    }
}

// Run after the shared pre-26.x model/ingredient conversion above.
if (nbtResources != null) processResources.doLast(nbtResources)
